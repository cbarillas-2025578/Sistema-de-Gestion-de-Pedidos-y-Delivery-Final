# Perfil de producción: exige variables de entorno reales (falla al iniciar si faltan).
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  error:
    include-stacktrace: never
    include-message: never

app:
  admin:
    # En producción NO se usan credenciales por defecto: el primer administrador
    # solo se crea si ADMIN_EMAIL y ADMIN_PASSWORD están definidos en el entorno.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

logging:
  level:
    root: WARN
    com.sistemadelivery: INFO
    org.springframework.security: WARN
