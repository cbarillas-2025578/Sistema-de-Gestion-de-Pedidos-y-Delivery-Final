spring:
  application:
    name: sistema-delivery
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:SistemaGestionPedidos}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gestiona exclusivamente Flyway; Hibernate solo valida.
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: America/Guatemala
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false
  servlet:
    encoding:
      charset: UTF-8

app:
  jwt:
    # Obligatorio en producción: defina JWT_SECRET (>= 32 caracteres). Ver .env.example
    secret: ChristopherBenjaminBarillasReyna2025578
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  admin:
    # Inicialización segura del primer administrador (§5.1).
    # En desarrollo se usan las credenciales de prueba que espera test-api1.sh;
    # en producción (ver application-prod.yml) el administrador solo se crea
    # si ADMIN_EMAIL/ADMIN_PASSWORD están definidos explícitamente.
    email: ${ADMIN_EMAIL:admin@fastorder.com}
    password: ${ADMIN_PASSWORD:Admin123*}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.sistemadelivery: INFO
    org.flywaydb: INFO
